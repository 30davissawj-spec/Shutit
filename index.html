<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAUS! Ruhe Jetzt! - Volume Monitor</title>
    <style>
        body {
            font-family: 'Arial Black', Gadget, sans-serif;
            text-align: center;
            background-color: #0b0c10;
            color: #ffffff;
            padding: 50px 20px;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.1s ease;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #1f2833;
            padding: 30px;
            border-radius: 0px; /* Sharp corners for authority */
            border: 3px solid #66fcf1;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
            position: relative;
            z-index: 10;
        }
        h2 {
            color: #ff4d4d;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button {
            background-color: #1f2833;
            color: #66fcf1;
            border: 2px solid #66fcf1;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.2s;
        }
        button:hover {
            background-color: #66fcf1;
            color: #0b0c10;
        }
        button.active {
            background-color: #ff4d4d;
            color: white;
            border-color: #ff0000;
            animation: pulse 1s infinite alternate;
        }
        .slider-box {
            margin: 30px 0;
        }
        input[type=range] {
            width: 100%;
            margin-top: 10px;
            accent-color: #ff4d4d;
        }
        .meter {
            font-size: 26px;
            font-weight: bold;
            margin: 20px 0;
            color: #ff4d4d;
            text-shadow: 0 0 5px rgba(255,77,77,0.5);
        }
        
        #flashOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ff0000;
            z-index: 5;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: flashAnimation 0.2s infinite alternate;
        }
        #flashText {
            color: white;
            font-size: 8vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 5px 5px 0px #000;
            font-family: Impact, sans-serif;
            margin: 0;
        }
        #subFlashText {
            color: #fff000;
            font-size: 4vw;
            font-weight: bold;
            text-transform: uppercase;
            font-family: Impact, sans-serif;
            margin-top: 10px;
        }
        @keyframes flashAnimation {
            from { background-color: #ff0000; }
            to { background-color: #4a0000; }
        }
        @keyframes pulse {
            from { box-shadow: 0 0 10px #ff4d4d; }
            to { box-shadow: 0 0 25px #ff0000; }
        }
        
        .shake {
            animation: shakeEffect 0.1s infinite;
        }
        @keyframes shakeEffect {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-2px, -3px) rotate(-1deg); }
            40% { transform: translate(-4px, 0px) rotate(1deg); }
            60% { transform: translate(0px, 3px) rotate(0deg); }
            80% { transform: translate(3px, -2px) rotate(1deg); }
            100% { transform: translate(-2px, 3px) rotate(-1deg); }
        }
    </style>
</head>
<body>

<div id="flashOverlay">
    <div id="flashText">HALT! RUHE JETZT!</div>
    <div id="subFlashText">YOU ARE ZU LOUD!!!</div>
</div>

<div class="container" id="mainContainer">
    <h2>👹 ZE VOLUMEN POLIZIE</h2>
    <p>Zis room demands absolute, total discipline! Set your legal decibel threshold below. If you violate ze rules, zere will be massive consequences!</p>

    <div class="meter" id="volumeDisplay">Loudness level: --</div>

    <div class="slider-box">
        <label id="thresholdLabel" style="font-weight: bold;">Maximum Allowed Noise: 50</label>
        <input type="range" id="thresholdSlider" min="5" max="100" value="50">
    </div>

    <button id="startBtn">ACTIVATE INSPECTION</button>
</div>

<script>
    let audioContext;
    let analyser;
    let microphone;
    let javascriptNode;
    let isMonitoring = false;
    let lastPlayedTime = 0;
    const cooldown = 4500; 

    const startBtn = document.getElementById('startBtn');
    const volumeDisplay = document.getElementById('volumeDisplay');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdLabel = document.getElementById('thresholdLabel');
    const flashOverlay = document.getElementById('flashOverlay');
    const body = document.body;

    // Aggressive phrases spoken with English words spelled phonetically for German speech engines
    const angryPhrases = [
        "Halt! Shut up immediately! Zis is completely unacceptable!",
        "Ruhe jetzt! I can hear you breathing through ze walls! Absolute silence!",
        "Es reicht! Silence! You are violating section five of ze noise protocol!",
        "Stopp! Verdammt noch mal! Shut your face right now!"
    ];

    thresholdSlider.addEventListener('input', (e) => {
        thresholdLabel.innerText = `Maximum Allowed Noise: ${e.target.value}`;
    });

    startBtn.addEventListener('click', async () => {
        if (!isMonitoring) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

                analyser.smoothingTimeConstant = 0.7; // Faster response time
                analyser.fftSize = 1024;

                microphone.connect(analyser);
                analyser.connect(javascriptNode);
                javascriptNode.connect(audioContext.destination);

                javascriptNode.onaudioprocess = () => {
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let values = 0;

                    for (let i = 0; i < array.length; i++) {
                        values += array[i];
                    }

                    const average = Math.round(values / array.length);
                    volumeDisplay.innerText = `Loudness level: ${average}`;

                    const currentThreshold = parseInt(thresholdSlider.value);
                    const now = Date.now();

                    if (average > currentThreshold && (now - lastPlayedTime > cooldown)) {
                        lastPlayedTime = now;
                        triggerAngryGermanScream();
                    }
                };

                isMonitoring = true;
                startBtn.innerText = "ABORT INSPECTION";
                startBtn.classList.add('active');

            } catch (err) {
                alert("ZE MICROPHONE WAS DENIED! UNACCEPTABLE! " + err);
            }
        } else {
            stopMonitoringProcess();
        }
    });

    function stopMonitoringProcess() {
        if (audioContext) audioContext.close();
        isMonitoring = false;
        startBtn.innerText = "ACTIVATE INSPECTION";
        startBtn.classList.remove('active');
        volumeDisplay.innerText = "Loudness level: --";
        hideThreat();
    }

    function triggerAngryGermanScream() {
        flashOverlay.style.display = 'flex';
        body.classList.add('shake');

        // Pick a random furious command
        const randomPhrase = angryPhrases[Math.floor(Math.random() * angryPhrases.length)];
        const utterance = new SpeechSynthesisUtterance(randomPhrase);
        
        // CRITICAL STEP: Locate an actual German voice package on the host system 
        const voices = window.speechSynthesis.getVoices();
        const germanVoice = voices.find(v => v.lang.startsWith('de-DE'));
        
        if (germanVoice) {
            utterance.voice = germanVoice;
        }

        utterance.volume = 1.0;  
        utterance.rate = 1.3;    // Fast but structured command speed
        utterance.pitch = 0.6;   // Aggressive, strict tone

        utterance.onend = () => {
            hideThreat();
        };

        window.speechSynthesis.speak(utterance);
    }

    function hideThreat() {
        flashOverlay.style.display = 'none';
        body.classList.remove('shake');
    }

    // Pre-load system voices so the German engine is ready instantly
    window.speechSynthesis.getVoices();
</script>

</body>
</html>
